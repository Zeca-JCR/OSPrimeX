<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Configuração Geração Documento</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1c2630",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for better aesthetics in the preview */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 20px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display antialiased overflow-x-hidden selection:bg-primary/30">
<div class="relative min-h-screen flex flex-col max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark border-x border-gray-200 dark:border-gray-800">
<!-- BottomSheetHandle Style -->
<div class="pt-3 pb-1 flex justify-center w-full">
<div class="h-1.5 w-12 rounded-full bg-slate-300 dark:bg-slate-700"></div>
</div>
<!-- Header -->
<header class="flex items-center justify-between px-4 py-3 sticky top-0 z-10 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm">
<div class="w-10"></div> <!-- Spacer for center alignment -->
<h1 class="text-lg font-bold leading-tight tracking-tight">Gerar Documento</h1>
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">close</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-4 pt-2 pb-24 gap-6 overflow-y-auto">
<!-- Format Selection -->
<section>
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary text-[20px]">print</span>
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Formato de Impressão</h3>
</div>
<div class="grid grid-cols-2 gap-3">
<!-- Option: PDF A4 -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="format" type="radio" value="a4"/>
<div class="flex flex-col items-center justify-center gap-3 p-4 rounded-xl border-2 border-transparent bg-surface-light dark:bg-surface-dark shadow-sm transition-all duration-200 peer-checked:border-primary peer-checked:bg-primary/5 dark:peer-checked:bg-primary/10 peer-checked:shadow-md">
<span class="material-symbols-outlined text-3xl text-slate-400 dark:text-slate-500 peer-checked:text-primary transition-colors">description</span>
<span class="text-sm font-medium text-slate-600 dark:text-slate-300 peer-checked:text-primary peer-checked:font-bold">PDF A4</span>
</div>
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined text-[20px] fill-1">check_circle</span>
</div>
</label>
<!-- Option: Thermal 80mm (Selected by default for demo) -->
<label class="cursor-pointer group relative">
<input checked="" class="peer sr-only" name="format" type="radio" value="thermal"/>
<div class="flex flex-col items-center justify-center gap-3 p-4 rounded-xl border-2 border-transparent bg-surface-light dark:bg-surface-dark shadow-sm transition-all duration-200 peer-checked:border-primary peer-checked:bg-primary/5 dark:peer-checked:bg-primary/10 peer-checked:shadow-md">
<span class="material-symbols-outlined text-3xl text-slate-400 dark:text-slate-500 peer-checked:text-primary transition-colors">receipt_long</span>
<span class="text-sm font-medium text-slate-600 dark:text-slate-300 peer-checked:text-primary peer-checked:font-bold">Térmico 80mm</span>
</div>
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined text-[20px] fill-1">check_circle</span>
</div>
</label>
</div>
</section>
<!-- Conditional Options (Pix) - Visually simulating 'Thermal' is active -->
<section class="animate-in fade-in slide-in-from-top-4 duration-500">
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary text-[20px]">settings_suggest</span>
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Opções do Recibo</h3>
</div>
<div class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm divide-y divide-gray-100 dark:divide-gray-800 overflow-hidden">
<!-- Pix Toggle -->
<div class="p-4 flex items-center justify-between group">
<div class="flex items-start gap-3">
<div class="p-2 rounded-lg bg-teal-500/10 text-teal-600 dark:text-teal-400">
<span class="material-symbols-outlined">qr_code_2</span>
</div>
<div class="flex flex-col">
<span class="font-medium text-slate-900 dark:text-white">Incluir QR Code Pix</span>
<span class="text-xs text-slate-500 dark:text-slate-400">Facilita o pagamento na entrega</span>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary/20 dark:peer-focus:ring-primary/30 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
<!-- Show Logo Toggle -->
<div class="p-4 flex items-center justify-between group">
<div class="flex items-start gap-3">
<div class="p-2 rounded-lg bg-blue-500/10 text-blue-600 dark:text-blue-400">
<span class="material-symbols-outlined">branding_watermark</span>
</div>
<div class="flex flex-col">
<span class="font-medium text-slate-900 dark:text-white">Exibir Logo da Oficina</span>
<span class="text-xs text-slate-500 dark:text-slate-400">No cabeçalho do cupom</span>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary/20 dark:peer-focus:ring-primary/30 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
</div>
</section>
<!-- Footer Notes -->
<section>
<div class="flex items-center gap-2 mb-3">
<span class="material-symbols-outlined text-primary text-[20px]">edit_note</span>
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Notas do Rodapé</h3>
</div>
<div class="relative">
<textarea class="w-full bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 rounded-xl p-4 text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-shadow min-h-[100px] resize-none" placeholder="Ex: Garantia de 90 dias para mão de obra. Obrigado pela preferência!"></textarea>
</div>
<p class="mt-2 text-xs text-slate-500 dark:text-slate-500 text-right">0/150 caracteres</p>
</section>
</main>
<!-- Fixed Footer Actions -->
<footer class="fixed bottom-0 w-full max-w-md bg-background-light dark:bg-background-dark border-t border-gray-200 dark:border-gray-800 p-4 pb-8 z-20">
<div class="flex flex-col gap-3">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-semibold h-12 rounded-lg shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transition-transform active:scale-[0.98]">
<span class="material-symbols-outlined">print</span>
                    Gerar Documento
                </button>
<button class="w-full bg-transparent hover:bg-black/5 dark:hover:bg-white/5 text-slate-600 dark:text-slate-300 font-medium h-12 rounded-lg flex items-center justify-center transition-colors">
                    Cancelar
                </button>
</div>
</footer>
</div>
</body></html>
