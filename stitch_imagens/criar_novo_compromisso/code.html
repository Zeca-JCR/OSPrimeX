<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Criar Novo Compromisso</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "surface-dark": "#192633",
                        "border-dark": "#324d67",
                        "text-secondary": "#92adc9",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for better mobile feel if needed, though mostly hidden on mobile */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display antialiased selection:bg-primary/30">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 flex items-center justify-between bg-white/80 dark:bg-[#111a22]/80 backdrop-blur-md px-4 py-3 border-b border-slate-200 dark:border-border-dark">
<button class="flex items-center justify-center p-2 -ml-2 rounded-full text-slate-500 dark:text-text-secondary hover:bg-slate-100 dark:hover:bg-surface-dark transition-colors">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
<h1 class="text-base font-bold leading-tight tracking-tight text-center flex-1 truncate px-2">
                Novo Agendamento
            </h1>
<button class="text-primary font-semibold text-sm px-2 -mr-2">
                Limpar
            </button>
</header>
<!-- Main Content Form -->
<main class="flex-1 flex flex-col p-4 pb-24 space-y-6">
<!-- Section: Date & Time -->
<section class="flex flex-col gap-3">
<h3 class="text-sm font-semibold text-slate-500 dark:text-text-secondary uppercase tracking-wider pl-1">Data e Hora</h3>
<div class="bg-white dark:bg-surface-dark rounded-xl border border-slate-200 dark:border-border-dark overflow-hidden">
<div class="flex flex-row divide-x divide-slate-200 dark:divide-border-dark">
<!-- Date Input -->
<div class="flex-1 relative group cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<label class="absolute inset-0 cursor-pointer" for="date"></label>
<div class="p-3 flex flex-col gap-1">
<span class="text-xs font-medium text-slate-400 dark:text-text-secondary flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">calendar_today</span>
                                    Data
                                </span>
<input class="bg-transparent border-none p-0 text-sm font-semibold text-slate-900 dark:text-white focus:ring-0 w-full cursor-pointer appearance-none" id="date" type="date" value="2023-10-27"/>
</div>
</div>
<!-- Time Input -->
<div class="w-1/3 relative group cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
<label class="absolute inset-0 cursor-pointer" for="time"></label>
<div class="p-3 flex flex-col gap-1">
<span class="text-xs font-medium text-slate-400 dark:text-text-secondary flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">schedule</span>
                                    Hora
                                </span>
<input class="bg-transparent border-none p-0 text-sm font-semibold text-slate-900 dark:text-white focus:ring-0 w-full cursor-pointer appearance-none" id="time" type="time" value="14:30"/>
</div>
</div>
</div>
</div>
</section>
<!-- Section: Client & Vehicle -->
<section class="flex flex-col gap-3">
<h3 class="text-sm font-semibold text-slate-500 dark:text-text-secondary uppercase tracking-wider pl-1">Cliente e Veículo</h3>
<div class="bg-white dark:bg-surface-dark rounded-xl border border-slate-200 dark:border-border-dark p-4 space-y-4 shadow-sm">
<!-- Client Search -->
<div class="relative">
<label class="block text-xs font-medium text-slate-500 dark:text-text-secondary mb-1.5 ml-1">Cliente</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-slate-400 dark:text-slate-500 pointer-events-none">search</span>
<input class="w-full bg-slate-50 dark:bg-[#111a22] border border-slate-200 dark:border-border-dark rounded-lg py-3 pl-10 pr-10 text-sm text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="Buscar cliente por nome ou CPF..." type="text"/>
<button class="absolute right-2 p-1 text-primary hover:bg-primary/10 rounded-md transition-colors" title="Adicionar Novo Cliente">
<span class="material-symbols-outlined text-xl">person_add</span>
</button>
</div>
<!-- Dropdown Results Simulation (Hidden by default, shown for context) -->
<!-- 
                        <div class="absolute top-full left-0 w-full mt-1 bg-white dark:bg-[#192633] border border-slate-200 dark:border-border-dark rounded-lg shadow-lg z-20 hidden">
                           <div class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer rounded">
                               <p class="text-sm font-medium text-slate-900 dark:text-white">João Silva</p>
                               <p class="text-xs text-slate-500">123.456.789-00</p>
                           </div>
                        </div>
                        -->
</div>
<!-- Vehicle Select (Disabled state visual cue if no client selected, here enabled for demo) -->
<div class="relative">
<label class="block text-xs font-medium text-slate-500 dark:text-text-secondary mb-1.5 ml-1">Veículo</label>
<div class="relative">
<select class="w-full bg-slate-50 dark:bg-[#111a22] border border-slate-200 dark:border-border-dark rounded-lg py-3 pl-3 pr-10 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary appearance-none transition-all">
<option disabled="" selected="" value="">Selecione um veículo...</option>
<option value="1">Ford Ka - ABC-1234 (Prata)</option>
<option value="2">Fiat Toro - XYZ-9876 (Vermelho)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
</div>
<p class="text-[10px] text-slate-400 dark:text-slate-500 mt-1 ml-1">Selecione o cliente primeiro para ver os veículos.</p>
</div>
</div>
</section>
<!-- Section: Service Details -->
<section class="flex flex-col gap-3">
<h3 class="text-sm font-semibold text-slate-500 dark:text-text-secondary uppercase tracking-wider pl-1">Detalhes do Serviço</h3>
<div class="bg-white dark:bg-surface-dark rounded-xl border border-slate-200 dark:border-border-dark p-4 space-y-4 shadow-sm">
<!-- Reason / Description -->
<div>
<label class="block text-xs font-medium text-slate-500 dark:text-text-secondary mb-1.5 ml-1">Motivo do Agendamento</label>
<input class="w-full bg-slate-50 dark:bg-[#111a22] border border-slate-200 dark:border-border-dark rounded-lg py-3 px-3 text-sm text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="Ex: Troca de óleo, Revisão de 10k..." type="text"/>
<!-- Quick Tags -->
<div class="flex flex-wrap gap-2 mt-3">
<button class="px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-600 dark:text-slate-300 hover:bg-primary/10 hover:border-primary hover:text-primary transition-all">Revisão</button>
<button class="px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-600 dark:text-slate-300 hover:bg-primary/10 hover:border-primary hover:text-primary transition-all">Troca de Óleo</button>
<button class="px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-600 dark:text-slate-300 hover:bg-primary/10 hover:border-primary hover:text-primary transition-all">Alinhamento</button>
</div>
</div>
<!-- Observations -->
<div>
<label class="block text-xs font-medium text-slate-500 dark:text-text-secondary mb-1.5 ml-1">Observações (Opcional)</label>
<textarea class="w-full bg-slate-50 dark:bg-[#111a22] border border-slate-200 dark:border-border-dark rounded-lg py-3 px-3 text-sm text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary resize-none transition-all" placeholder="Detalhes adicionais ou solicitações do cliente..." rows="3"></textarea>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Actions -->
<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-white/90 dark:bg-[#111a22]/90 backdrop-blur-lg border-t border-slate-200 dark:border-border-dark z-20">
<div class="flex gap-3">
<button class="flex-1 py-3.5 px-4 rounded-xl text-sm font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors focus:ring-2 focus:ring-slate-500/20">
                    Cancelar
                </button>
<button class="flex-[2] py-3.5 px-4 rounded-xl text-sm font-semibold text-white bg-primary hover:bg-blue-600 shadow-lg shadow-blue-500/30 transition-all active:scale-[0.98] focus:ring-2 focus:ring-primary/50 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">check</span>
                    Salvar Compromisso
                </button>
</div>
</div>
</div>
</body></html>
