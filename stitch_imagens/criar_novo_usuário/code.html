<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Criar Novo Usuário</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
            extend: {
                colors: {
                "primary": "#137fec",
                "background-light": "#f6f7f8",
                "background-dark": "#101922", // Matching the dark tone from provided components
                },
                fontFamily: {
                "display": ["Inter", "sans-serif"]
                },
                borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
            },
        }
    </script>
<style>
        /* Custom scrollbar for better mobile feel if needed */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #324d67;
            border-radius: 4px;
        }
        
        /* Hide number input spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-white transition-colors duration-200">
<!-- Main Container -->
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden">
<!-- Top App Bar -->
<header class="sticky top-0 z-20 flex items-center justify-between bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-3">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-900 dark:text-white">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<h1 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Criar Novo Usuário</h1>
</header>
<!-- Content Scroll Area -->
<main class="flex-1 flex flex-col pb-24">
<!-- Section 1: Dados Pessoais -->
<div class="pt-6">
<h2 class="px-4 text-base font-bold leading-tight tracking-tight text-slate-900 dark:text-white">Dados Pessoais</h2>
<div class="mt-4 px-4 flex flex-col gap-5">
<!-- Name Input -->
<label class="flex flex-col w-full">
<span class="text-sm font-medium text-slate-600 dark:text-slate-400 mb-2">Nome Completo</span>
<div class="relative">
<input class="w-full rounded-xl border border-slate-300 dark:border-[#324d67] bg-white dark:bg-[#192633] px-4 py-3.5 text-base text-slate-900 dark:text-white placeholder-slate-400 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" placeholder="Ex: João Silva" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">person</span>
</div>
</label>
<!-- Email Input -->
<label class="flex flex-col w-full">
<span class="text-sm font-medium text-slate-600 dark:text-slate-400 mb-2">E-mail Corporativo (Login)</span>
<div class="relative">
<input class="w-full rounded-xl border border-slate-300 dark:border-[#324d67] bg-white dark:bg-[#192633] px-4 py-3.5 text-base text-slate-900 dark:text-white placeholder-slate-400 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" placeholder="usuario@oficina.com" type="email"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">mail</span>
</div>
</label>
</div>
</div>
<div class="my-6 h-px bg-slate-200 dark:bg-slate-800 mx-4"></div>
<!-- Section 2: Segurança -->
<div>
<h2 class="px-4 text-base font-bold leading-tight tracking-tight text-slate-900 dark:text-white">Segurança</h2>
<div class="mt-4 px-4 flex flex-col gap-5">
<!-- Password Input -->
<label class="flex flex-col w-full">
<span class="text-sm font-medium text-slate-600 dark:text-slate-400 mb-2">Senha Inicial</span>
<div class="relative group">
<input class="w-full rounded-xl border border-slate-300 dark:border-[#324d67] bg-white dark:bg-[#192633] px-4 py-3.5 text-base text-slate-900 dark:text-white placeholder-slate-400 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all group-has-[:disabled]:opacity-50 group-has-[:disabled]:cursor-not-allowed" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</label>
<!-- Auto Generate Toggle -->
<div class="flex items-center justify-between rounded-xl bg-slate-100 dark:bg-[#192633]/50 p-4 border border-transparent dark:border-[#324d67]/50">
<div class="flex flex-col">
<span class="text-sm font-medium text-slate-900 dark:text-white">Gerar automaticamente</span>
<span class="text-xs text-slate-500 dark:text-slate-400">Envia uma senha temporária por e-mail</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-slate-300 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary/50 dark:peer-focus:ring-primary/30 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
</div>
</div>
<div class="my-6 h-px bg-slate-200 dark:bg-slate-800 mx-4"></div>
<!-- Section 3: Perfil de Acesso -->
<div>
<h2 class="px-4 text-base font-bold leading-tight tracking-tight text-slate-900 dark:text-white mb-4">Perfil de Acesso</h2>
<div class="px-4 flex flex-col gap-3" role="radiogroup">
<!-- Admin Option (Active State Example) -->
<label class="relative flex cursor-pointer items-start gap-4 rounded-xl border-2 border-primary bg-primary/5 dark:bg-primary/10 p-4 transition-all shadow-sm">
<div class="flex items-center justify-center size-10 rounded-full bg-primary/20 text-primary shrink-0">
<span class="material-symbols-outlined">admin_panel_settings</span>
</div>
<div class="flex-1">
<div class="flex items-center justify-between">
<p class="font-semibold text-slate-900 dark:text-white">Administrador</p>
<input checked="" class="size-5 border-slate-300 text-primary focus:ring-primary" name="role" type="radio"/>
</div>
<p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Acesso total a todas as funcionalidades e configurações.</p>
</div>
</label>
<!-- Technician Option -->
<label class="relative flex cursor-pointer items-start gap-4 rounded-xl border border-slate-200 dark:border-[#324d67] bg-white dark:bg-[#192633] p-4 transition-all hover:border-primary/50">
<div class="flex items-center justify-center size-10 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 shrink-0">
<span class="material-symbols-outlined">home_repair_service</span>
</div>
<div class="flex-1">
<div class="flex items-center justify-between">
<p class="font-medium text-slate-900 dark:text-white">Técnico</p>
<input class="size-5 border-slate-300 dark:border-slate-600 bg-transparent text-primary focus:ring-primary" name="role" type="radio"/>
</div>
<p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Visualiza ordens de serviço e agenda de tarefas.</p>
</div>
</label>
<!-- Finance Option -->
<label class="relative flex cursor-pointer items-start gap-4 rounded-xl border border-slate-200 dark:border-[#324d67] bg-white dark:bg-[#192633] p-4 transition-all hover:border-primary/50">
<div class="flex items-center justify-center size-10 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 shrink-0">
<span class="material-symbols-outlined">payments</span>
</div>
<div class="flex-1">
<div class="flex items-center justify-between">
<p class="font-medium text-slate-900 dark:text-white">Financeiro</p>
<input class="size-5 border-slate-300 dark:border-slate-600 bg-transparent text-primary focus:ring-primary" name="role" type="radio"/>
</div>
<p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Acesso a faturamento, contas a pagar e relatórios.</p>
</div>
</label>
</div>
</div>
</main>
<!-- Sticky Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 right-0 z-30 bg-white dark:bg-[#111a22] border-t border-slate-200 dark:border-slate-800 p-4 pb-8 sm:pb-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] dark:shadow-none">
<div class="mx-auto flex w-full max-w-lg items-center gap-3">
<button class="flex-1 rounded-xl border border-slate-300 dark:border-slate-600 bg-transparent px-5 py-3.5 text-base font-semibold text-slate-700 dark:text-white hover:bg-slate-50 dark:hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-400 transition-colors">
                    Cancelar
                </button>
<button class="flex-[2] rounded-xl bg-primary px-5 py-3.5 text-base font-semibold text-white shadow-lg shadow-primary/25 hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-[#111a22] transition-all">
                    Salvar Usuário
                </button>
</div>
</footer>
</div>
<!-- Script to simulate simple interactions (Visual only) -->
<script>
        // Simple logic to toggle visual styles on radio buttons
        const radios = document.querySelectorAll('input[name="role"]');
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Reset all
                document.querySelectorAll('input[name="role"]').forEach(r => {
                    const label = r.closest('label');
                    const iconBox = label.querySelector('.rounded-full');
                    const icon = label.querySelector('.material-symbols-outlined');
                    const title = label.querySelector('p.font-semibold, p.font-medium');
                    
                    // Remove Active Classes
                    label.classList.remove('border-2', 'border-primary', 'bg-primary/5', 'dark:bg-primary/10');
                    label.classList.add('border', 'border-slate-200', 'dark:border-[#324d67]', 'bg-white', 'dark:bg-[#192633]');
                    
                    // Icon Box
                    iconBox.classList.remove('bg-primary/20', 'text-primary');
                    iconBox.classList.add('bg-slate-100', 'dark:bg-slate-700', 'text-slate-500', 'dark:text-slate-400');
                    
                    // Title
                    title.classList.remove('font-semibold');
                    title.classList.add('font-medium');
                });

                // Set Active
                if(e.target.checked) {
                    const label = e.target.closest('label');
                    const iconBox = label.querySelector('.rounded-full');
                    const title = label.querySelector('p.font-medium');

                    // Add Active Classes
                    label.classList.remove('border', 'border-slate-200', 'dark:border-[#324d67]', 'bg-white', 'dark:bg-[#192633]');
                    label.classList.add('border-2', 'border-primary', 'bg-primary/5', 'dark:bg-primary/10');
                    
                    // Icon Box
                    iconBox.classList.remove('bg-slate-100', 'dark:bg-slate-700', 'text-slate-500', 'dark:text-slate-400');
                    iconBox.classList.add('bg-primary/20', 'text-primary');

                    // Title
                    title.classList.remove('font-medium');
                    title.classList.add('font-semibold');
                }
            });
        });
    </script>
</body></html>
