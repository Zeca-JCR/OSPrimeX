<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Editar Compromisso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#137fec",
                "background-light": "#f6f7f8",
                "background-dark": "#101922",
                "surface-dark": "#192633",
                "border-dark": "#324d67",
              },
              fontFamily: {
                "display": ["Inter", "sans-serif"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
            },
          },
        }
      </script>
<style>
        /* Custom scrollbar for better mobile feel if needed, though mostly native on iOS */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased min-h-screen flex flex-col pb-24">
<!-- Top App Bar -->
<header class="sticky top-0 z-40 w-full backdrop-blur-md bg-white/80 dark:bg-background-dark/90 border-b border-gray-200 dark:border-border-dark transition-colors duration-300">
<div class="flex items-center justify-between px-4 py-3">
<button class="flex items-center justify-center p-2 rounded-full text-slate-600 dark:text-white hover:bg-slate-100 dark:hover:bg-white/10 transition-colors group">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center">
                Editar Compromisso
            </h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Form -->
<main class="flex-1 w-full max-w-md mx-auto px-4 py-6 space-y-6">
<!-- Status Card -->
<div class="bg-white dark:bg-surface-dark rounded-xl p-4 shadow-sm border border-gray-100 dark:border-border-dark flex items-center justify-between">
<div class="flex flex-col">
<span class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Status Atual</span>
<span class="text-sm font-semibold text-slate-900 dark:text-white">Confirmado</span>
</div>
<div class="px-3 py-1 rounded-full bg-green-100 dark:bg-green-900/30 border border-green-200 dark:border-green-800 flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-green-500"></div>
<span class="text-xs font-bold text-green-700 dark:text-green-400">Confirmado</span>
</div>
</div>
<!-- Section: Agendamento -->
<section>
<div class="flex items-center gap-2 mb-3 px-1">
<span class="material-symbols-outlined text-primary text-[20px]">event</span>
<h3 class="text-slate-900 dark:text-white text-base font-bold">Agendamento</h3>
</div>
<div class="grid grid-cols-2 gap-4">
<label class="flex flex-col gap-1.5">
<span class="text-sm font-medium text-slate-600 dark:text-slate-300">Data</span>
<div class="relative">
<input class="form-input w-full rounded-lg border-gray-200 dark:border-border-dark bg-white dark:bg-surface-dark text-slate-900 dark:text-white h-12 px-3 focus:border-primary focus:ring-primary dark:focus:border-primary dark:focus:ring-primary text-sm font-medium shadow-sm transition-all" type="date" value="2023-10-24"/>
</div>
</label>
<label class="flex flex-col gap-1.5">
<span class="text-sm font-medium text-slate-600 dark:text-slate-300">Hora</span>
<div class="relative">
<input class="form-input w-full rounded-lg border-gray-200 dark:border-border-dark bg-white dark:bg-surface-dark text-slate-900 dark:text-white h-12 px-3 focus:border-primary focus:ring-primary dark:focus:border-primary dark:focus:ring-primary text-sm font-medium shadow-sm transition-all" type="time" value="14:30"/>
</div>
</label>
</div>
</section>
<!-- Section: Cliente e Veículo -->
<section>
<div class="flex items-center gap-2 mb-3 px-1 pt-2">
<span class="material-symbols-outlined text-primary text-[20px]">person</span>
<h3 class="text-slate-900 dark:text-white text-base font-bold">Cliente e Veículo</h3>
</div>
<div class="space-y-4">
<label class="flex flex-col gap-1.5">
<span class="text-sm font-medium text-slate-600 dark:text-slate-300">Cliente</span>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500 group-focus-within:text-primary transition-colors text-[20px]">search</span>
</div>
<select class="form-select w-full rounded-lg border-gray-200 dark:border-border-dark bg-white dark:bg-surface-dark text-slate-900 dark:text-white h-12 pl-10 pr-10 focus:border-primary focus:ring-primary dark:focus:border-primary dark:focus:ring-primary text-sm font-medium shadow-sm appearance-none transition-all">
<option selected="" value="1">Ricardo Almeida</option>
<option value="2">Fernanda Costa</option>
<option value="3">João Silva</option>
</select>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500 text-[20px]">expand_more</span>
</div>
</div>
</label>
<label class="flex flex-col gap-1.5">
<span class="text-sm font-medium text-slate-600 dark:text-slate-300">Veículo</span>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500 group-focus-within:text-primary transition-colors text-[20px]">directions_car</span>
</div>
<select class="form-select w-full rounded-lg border-gray-200 dark:border-border-dark bg-white dark:bg-surface-dark text-slate-900 dark:text-white h-12 pl-10 pr-10 focus:border-primary focus:ring-primary dark:focus:border-primary dark:focus:ring-primary text-sm font-medium shadow-sm appearance-none transition-all">
<option selected="" value="1">Honda Civic - ABC-1234</option>
<option value="2">Fiat Toro - XYZ-9876</option>
</select>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500 text-[20px]">expand_more</span>
</div>
</div>
</label>
</div>
</section>
<!-- Section: Detalhes do Serviço -->
<section>
<div class="flex items-center gap-2 mb-3 px-1 pt-2">
<span class="material-symbols-outlined text-primary text-[20px]">build</span>
<h3 class="text-slate-900 dark:text-white text-base font-bold">Detalhes do Serviço</h3>
</div>
<div class="space-y-4">
<label class="flex flex-col gap-1.5">
<span class="text-sm font-medium text-slate-600 dark:text-slate-300">Motivo do Agendamento</span>
<input class="form-input w-full rounded-lg border-gray-200 dark:border-border-dark bg-white dark:bg-surface-dark text-slate-900 dark:text-white h-12 px-3 focus:border-primary focus:ring-primary dark:focus:border-primary dark:focus:ring-primary text-sm font-medium shadow-sm transition-all placeholder:text-slate-400" placeholder="Ex: Troca de Óleo" type="text" value="Revisão de 10.000km"/>
</label>
<label class="flex flex-col gap-1.5">
<span class="text-sm font-medium text-slate-600 dark:text-slate-300">Observações</span>
<textarea class="form-textarea w-full rounded-lg border-gray-200 dark:border-border-dark bg-white dark:bg-surface-dark text-slate-900 dark:text-white p-3 min-h-[120px] focus:border-primary focus:ring-primary dark:focus:border-primary dark:focus:ring-primary text-sm font-medium shadow-sm transition-all resize-none placeholder:text-slate-400" placeholder="Adicione notas internas sobre o serviço...">Cliente relatou barulho na suspensão dianteira direita.</textarea>
</label>
</div>
</section>
<!-- Delete Option -->
<div class="pt-4 flex justify-center">
<button class="text-red-500 dark:text-red-400 text-sm font-semibold hover:text-red-600 dark:hover:text-red-300 transition-colors flex items-center gap-2 py-2">
<span class="material-symbols-outlined text-[18px]">delete</span>
                Excluir Agendamento
            </button>
</div>
</main>
<!-- Sticky Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-white dark:bg-background-dark border-t border-gray-200 dark:border-border-dark p-4 z-50 safe-pb">
<div class="max-w-md mx-auto flex gap-3">
<button class="flex-1 h-12 rounded-lg bg-slate-100 dark:bg-surface-dark text-slate-700 dark:text-slate-300 font-semibold text-sm hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors border border-transparent dark:border-border-dark">
                Cancelar
            </button>
<button class="flex-[2] h-12 rounded-lg bg-primary text-white font-bold text-sm shadow-lg shadow-primary/20 hover:bg-blue-600 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">save</span>
                Salvar Alterações
            </button>
</div>
</div>
<!-- Map Image (Contextual Background Visual - abstract or slight map hint) -->
<!-- Using a subtle pattern/gradient as a background element to give depth if needed, but keeping it clean for SaaS -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 opacity-50 dark:opacity-20" style="background-image: radial-gradient(circle at 100% 0%, rgba(19, 127, 236, 0.08) 0%, transparent 25%);">
</div>
</body></html>
