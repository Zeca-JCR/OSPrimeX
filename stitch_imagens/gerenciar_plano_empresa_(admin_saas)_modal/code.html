<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gerenciar Plano - OSPrimeX</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
              "surface-dark": "#192633",
              "surface-light": "#ffffff",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-black/60 font-display flex items-end justify-center min-h-screen w-full sm:items-center p-0 sm:p-4 backdrop-blur-sm">
<!-- Modal/Bottom Sheet Container -->
<div class="relative w-full max-w-md bg-background-light dark:bg-background-dark sm:rounded-xl rounded-t-xl shadow-2xl overflow-hidden flex flex-col max-h-[95vh] sm:max-h-[90vh]">
<!-- BottomSheetHandle -->
<div class="flex flex-col items-center pt-3 pb-1 shrink-0 bg-background-light dark:bg-background-dark z-10">
<div class="h-1.5 w-12 rounded-full bg-gray-300 dark:bg-[#324d67]"></div>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto overflow-x-hidden pb-24 sm:pb-6">
<!-- Header Section -->
<div class="px-5 pt-2">
<div class="flex justify-between items-start">
<div>
<h2 class="text-gray-900 dark:text-white tracking-tight text-2xl font-bold leading-tight">Gerenciar Assinatura</h2>
<p class="text-gray-500 dark:text-[#92adc9] text-sm font-normal leading-normal mt-1">Cliente: Oficina Silva Auto Center</p>
</div>
<button class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
<!-- Current Plan Card -->
<div class="p-5">
<div class="flex flex-col sm:flex-row items-stretch justify-between gap-4 rounded-xl bg-surface-light dark:bg-surface-dark p-4 shadow-sm border border-gray-200 dark:border-gray-700">
<div class="flex flex-col gap-2 flex-[2_2_0px]">
<div>
<span class="inline-flex items-center rounded-md bg-green-500/10 px-2 py-1 text-xs font-medium text-green-600 dark:text-green-400 ring-1 ring-inset ring-green-500/20 mb-2">Ativo</span>
<p class="text-gray-900 dark:text-white text-lg font-bold leading-tight">Plano Atual: Pro</p>
</div>
<div class="flex items-center gap-1 text-gray-500 dark:text-[#92adc9] text-sm">
<span class="material-symbols-outlined text-[18px]">event</span>
<span>Renova em 15/11/2023</span>
</div>
</div>
<!-- Image with data-alt -->
<div class="w-full sm:w-24 h-24 sm:h-auto bg-center bg-no-repeat bg-cover rounded-lg flex-none" data-alt="Abstract blue geometric shapes representing business growth" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAmBT9gCLMTNFzbcQzoC4_cv-NyCEl46EjXbkBmtB-F2DJthjhBFvNmy5OZ8HMypfzNHyFv2gBu79p-aRQ2BH5UDdbLQPS_ZKUTWTQfsAyYjs6APEnoZhOlFOMXm_MuRbMwUkHYFgWJBwSyD4Oo2tI77j4Mlo2GhRtcF7yXnUa6dR5MMfjLlwZfivEn6IuSUUX-1x3tM8qFPmFcZ3ZTFLPyB--YI5zOkdVSH-kkvr9g-q5RHl1K9HUN3r8W_WKfwUwcQ7bm6X4hrBmi");'>
</div>
</div>
</div>
<div class="h-1 bg-gray-100 dark:bg-[#15202b] mx-5 rounded-full"></div>
<!-- Plan Selection Title -->
<div class="px-5 pt-6 pb-3">
<h3 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">Selecionar Novo Plano</h3>
</div>
<!-- Plans List -->
<div class="px-5 flex flex-col gap-3">
<!-- Plan Option: Basic -->
<label class="group relative flex cursor-pointer rounded-xl border border-gray-200 dark:border-gray-700 bg-surface-light dark:bg-surface-dark p-4 shadow-sm hover:border-primary transition-all focus-within:ring-2 focus-within:ring-primary">
<input aria-labelledby="plan-basic-label" class="sr-only" name="plan-selection" type="radio"/>
<span class="flex flex-1">
<span class="flex flex-col">
<span class="block text-sm font-bold text-gray-900 dark:text-white" id="plan-basic-label">Básico</span>
<span class="mt-1 flex items-center text-sm text-gray-500 dark:text-gray-400">Até 3 usuários • Gestão simples</span>
<span class="mt-2 text-sm font-medium text-gray-900 dark:text-white">R$ 99/mês</span>
</span>
</span>
<span class="flex items-center h-full ml-4">
<span class="h-5 w-5 rounded-full border border-gray-300 dark:border-gray-500 flex items-center justify-center group-hover:border-primary">
<!-- Radio unchecked state is empty circle -->
<span class="h-2.5 w-2.5 rounded-full bg-primary opacity-0 transition-opacity peer-checked:opacity-100"></span>
</span>
</span>
<!-- Hidden active styling logic via CSS sibling selector logic usually, here simulating via class structure for demo -->
<div class="absolute -inset-px rounded-xl border-2 border-transparent pointer-events-none group-has-[:checked]:border-primary"></div>
<div class="absolute right-4 top-1/2 -translate-y-1/2 h-5 w-5 rounded-full border border-gray-300 dark:border-gray-600 bg-transparent flex items-center justify-center group-has-[:checked]:border-primary group-has-[:checked]:bg-primary">
<span class="material-symbols-outlined text-white text-[14px] opacity-0 group-has-[:checked]:opacity-100">check</span>
</div>
</label>
<!-- Plan Option: Pro (Selected) -->
<label class="group relative flex cursor-pointer rounded-xl border border-primary bg-primary/5 dark:bg-primary/10 p-4 shadow-sm transition-all">
<input aria-labelledby="plan-pro-label" checked="" class="sr-only" name="plan-selection" type="radio"/>
<span class="flex flex-1">
<span class="flex flex-col">
<div class="flex items-center gap-2">
<span class="block text-sm font-bold text-gray-900 dark:text-white" id="plan-pro-label">Pro</span>
<span class="inline-flex items-center rounded-md bg-primary/10 px-2 py-0.5 text-xs font-medium text-primary ring-1 ring-inset ring-primary/20">Popular</span>
</div>
<span class="mt-1 flex items-center text-sm text-gray-500 dark:text-gray-300">Até 10 usuários • Relatórios avançados</span>
<span class="mt-2 text-sm font-medium text-gray-900 dark:text-white">R$ 199/mês</span>
</span>
</span>
<div class="absolute -inset-px rounded-xl border-2 border-primary pointer-events-none"></div>
<div class="absolute right-4 top-1/2 -translate-y-1/2 h-5 w-5 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[14px]">check</span>
</div>
</label>
<!-- Plan Option: Enterprise -->
<label class="group relative flex cursor-pointer rounded-xl border border-gray-200 dark:border-gray-700 bg-surface-light dark:bg-surface-dark p-4 shadow-sm hover:border-primary transition-all">
<input aria-labelledby="plan-ent-label" class="sr-only" name="plan-selection" type="radio"/>
<span class="flex flex-1">
<span class="flex flex-col">
<span class="block text-sm font-bold text-gray-900 dark:text-white" id="plan-ent-label">Enterprise</span>
<span class="mt-1 flex items-center text-sm text-gray-500 dark:text-gray-400">Usuários ilimitados • API dedicada</span>
<span class="mt-2 text-sm font-medium text-gray-900 dark:text-white">R$ 499/mês</span>
</span>
</span>
<div class="absolute -inset-px rounded-xl border-2 border-transparent pointer-events-none group-has-[:checked]:border-primary"></div>
<div class="absolute right-4 top-1/2 -translate-y-1/2 h-5 w-5 rounded-full border border-gray-300 dark:border-gray-600 bg-transparent flex items-center justify-center group-has-[:checked]:border-primary group-has-[:checked]:bg-primary">
<span class="material-symbols-outlined text-white text-[14px] opacity-0 group-has-[:checked]:opacity-100">check</span>
</div>
</label>
</div>
<!-- Configuration Section -->
<div class="px-5 pt-6 flex flex-col gap-4">
<!-- Date Input -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-gray-700 dark:text-gray-300" for="start-date">Início da Vigência</label>
<div class="relative">
<input class="block w-full rounded-lg border-0 py-3 pl-3 pr-10 text-gray-900 dark:text-white shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-700 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary bg-surface-light dark:bg-surface-dark sm:text-sm sm:leading-6" id="start-date" type="date" value="2023-11-15"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
<span class="material-symbols-outlined text-gray-400">calendar_month</span>
</div>
</div>
</div>
<!-- Toggle -->
<div class="flex items-center justify-between py-2">
<div class="flex flex-col">
<span class="text-sm font-medium text-gray-900 dark:text-white">Cobrar Pro-rata</span>
<span class="text-xs text-gray-500 dark:text-gray-400">Ajustar fatura proporcionalmente</span>
</div>
<button aria-checked="true" class="bg-primary relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" role="switch" type="button">
<span aria-hidden="true" class="translate-x-5 pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
</button>
</div>
</div>
</div>
<!-- Sticky Footer for Mobile Actions -->
<div class="absolute bottom-0 left-0 w-full p-5 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur border-t border-gray-200 dark:border-gray-800 flex flex-col gap-3">
<button class="flex w-full items-center justify-center rounded-lg bg-primary px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-primary/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-all">
                Salvar Alterações
            </button>
<button class="flex w-full items-center justify-center rounded-lg bg-transparent px-4 py-3 text-sm font-semibold text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-surface-dark transition-all">
                Cancelar
            </button>
</div>
</div>
</body></html>
