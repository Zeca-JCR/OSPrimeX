<!DOCTYPE html>
<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Detalhes do Produto</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e293b",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }.no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen relative overflow-x-hidden">
<div class="relative flex flex-col w-full max-w-md mx-auto min-h-screen pb-24">
<header class="sticky top-0 z-20 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between">
<div class="flex items-center gap-3">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-slate-600 dark:text-slate-300">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">Detalhes do Produto</h1>
</div>
<button class="flex items-center justify-center size-10 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-slate-600 dark:text-slate-300">
<span class="material-symbols-outlined">more_vert</span>
</button>
</header>
<main class="flex flex-col gap-6 px-4 py-6">
<div class="bg-white dark:bg-surface-dark rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-4">
<div class="flex gap-4">
<div class="shrink-0 size-24 rounded-xl bg-slate-100 dark:bg-slate-800 bg-cover bg-center border border-slate-100 dark:border-slate-700" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC1feCbJhvFpAM5_D2aQt4p54X7T6-8pCB0CHE3oQ7JCKAwaGXT9KSNMaf4Ms__-W9eJHsZNKnTp5SA2vpwkcL09te4tB1g98ziXve9imCDMUKh1O3fuKsKijA1Au7IIaaD05OUUj-UIHm5sZxmS13V3dT-5h7g7v8V1ELBYN_FX4V58Pwj2e97Kog4PV3VFRVkvZeUlfiIg6wouqD8R48b_NeL4RpHeHZ8GM8LQFwsyMZeAvZ6RxF1oSrjjD3Ju8_Zh3iDMSOnXGpi');">
</div>
<div class="flex flex-col gap-3 w-full">
<div>
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Nome do Produto</label>
<input class="w-full text-sm font-semibold text-slate-900 dark:text-white bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-lg focus:ring-primary focus:border-primary px-3 py-2" type="text" value="Óleo Sintético 5W30"/>
</div>
<div>
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Código</label>
<input class="w-full text-sm font-mono text-slate-700 dark:text-slate-300 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-lg focus:ring-primary focus:border-primary px-3 py-2" type="text" value="COD-4821"/>
</div>
</div>
</div>
<div class="mt-4">
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Descrição</label>
<textarea class="w-full text-sm text-slate-700 dark:text-slate-300 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-lg focus:ring-primary focus:border-primary px-3 py-2 resize-none" rows="2">Óleo lubrificante 100% sintético para motores a gasolina, etanol, flex e GNV.</textarea>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="col-span-2 bg-white dark:bg-surface-dark rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-4 flex items-center justify-between">
<div>
<span class="block text-xs font-medium text-slate-500 dark:text-slate-400">Estoque Atual</span>
<div class="flex items-baseline gap-1 mt-1">
<span class="text-3xl font-bold text-slate-900 dark:text-white">24</span>
<span class="text-sm text-slate-500 font-medium">unidades</span>
</div>
</div>
<div class="size-12 rounded-full bg-blue-50 dark:bg-blue-900/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">inventory_2</span>
</div>
</div>
<div class="bg-white dark:bg-surface-dark rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-4">
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-2">Preço de Custo</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">R$</span>
<input class="w-full pl-9 pr-3 py-2 text-sm font-semibold bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-lg focus:ring-primary focus:border-primary text-slate-900 dark:text-white" step="0.01" type="number" value="22.50"/>
</div>
</div>
<div class="bg-white dark:bg-surface-dark rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-4">
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-2">Preço de Venda</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">R$</span>
<input class="w-full pl-9 pr-3 py-2 text-sm font-semibold bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-lg focus:ring-primary focus:border-primary text-slate-900 dark:text-white" step="0.01" type="number" value="35.00"/>
</div>
</div>
</div>
<div class="flex items-center gap-4 py-2">
<div class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></div>
<span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Movimentação Manual</span>
<div class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></div>
</div>
<div class="bg-white dark:bg-surface-dark rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
<div class="px-4 py-3 border-b border-slate-100 dark:border-slate-700 bg-emerald-50/50 dark:bg-emerald-900/10 flex items-center gap-2">
<span class="material-symbols-outlined text-emerald-600 dark:text-emerald-400">add_circle</span>
<h3 class="font-semibold text-emerald-900 dark:text-emerald-100">Entrada Manual</h3>
</div>
<div class="p-4 grid gap-4">
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Quantidade (+)</label>
<input class="w-full text-sm bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 px-3 py-2" placeholder="0" type="number"/>
</div>
<div>
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Data Compra</label>
<input class="w-full text-sm bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 px-3 py-2 text-slate-500" type="date"/>
</div>
</div>
<div class="flex items-start gap-3 p-3 rounded-lg bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-700">
<div class="flex h-5 items-center">
<input class="size-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-600 dark:border-slate-600 dark:bg-slate-700 dark:ring-offset-surface-dark" id="expense" type="checkbox"/>
</div>
<label class="text-sm text-slate-600 dark:text-slate-300 cursor-pointer select-none" for="expense">
<span class="font-medium block text-slate-900 dark:text-white">Gerar despesa no financeiro</span>
<span class="text-xs text-slate-500">Registra automaticamente uma conta a pagar.</span>
</label>
</div>
</div>
</div>
<div class="bg-white dark:bg-surface-dark rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
<div class="px-4 py-3 border-b border-slate-100 dark:border-slate-700 bg-amber-50/50 dark:bg-amber-900/10 flex items-center gap-2">
<span class="material-symbols-outlined text-amber-600 dark:text-amber-400">remove_circle</span>
<h3 class="font-semibold text-amber-900 dark:text-amber-100">Saída Manual</h3>
</div>
<div class="p-4 grid gap-4">
<div class="grid grid-cols-3 gap-4">
<div class="col-span-1">
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Qtd (-)</label>
<input class="w-full text-sm bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-lg focus:ring-amber-500 focus:border-amber-500 px-3 py-2" placeholder="0" type="number"/>
</div>
<div class="col-span-2">
<label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Motivo do Ajuste</label>
<select class="w-full text-sm bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-lg focus:ring-amber-500 focus:border-amber-500 px-3 py-2 text-slate-700 dark:text-slate-300">
<option value="">Selecione...</option>
<option value="adjust">Ajuste de Inventário</option>
<option value="loss">Perda / Quebra</option>
<option value="internal">Uso Interno</option>
<option value="expired">Validade Vencida</option>
</select>
</div>
</div>
</div>
</div>
</main>
<div class="fixed bottom-0 left-0 w-full bg-white dark:bg-surface-dark border-t border-slate-200 dark:border-slate-800 px-4 py-4 z-30">
<div class="max-w-md mx-auto flex gap-3">
<button class="flex-1 h-12 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-semibold text-sm hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                    Cancelar
                </button>
<button class="flex-[2] h-12 rounded-xl bg-primary text-white font-semibold text-sm shadow-lg shadow-primary/25 hover:bg-blue-600 transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">save</span>
                    Salvar Alterações
                </button>
</div>
</div>
</div>

</body></html>
